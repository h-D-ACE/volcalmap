name: Offline validation
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r vm_acoustic/requirements.txt
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python vm_acoustic/test_contracts.py
      - run: python vm_perceptual/test_pipeline.py
      - run: python vm_acoustic/train_physics.py --smoke --output vm_acoustic/training_runs/ci
      - run: python vm_acoustic/train_physics.py --smoke --resume vm_acoustic/training_runs/ci/last.pt --output vm_acoustic/training_runs/ci
